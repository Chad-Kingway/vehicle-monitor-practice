<body><main><div class="kicker">Reference</div><h1>車隊清單範本</h1><article>
<pre><code>@for (vehicle of fleet(); track vehicle.id) {
  &lt;button&gt;{{ vehicle.id }}&lt;/button&gt;
}</code></pre>
<ul><li><code>fleet()</code>：目前要顯示的車輛清單。</li><li><code>@for</code>：每一台車建立一份範本。</li><li><code>vehicle.id</code>：目前這一列的車輛識別碼。</li><li><code>track vehicle.id</code>：清單更新時，以 ID 對應車輛及其畫面列。</li></ul>

</article></main></body></html>
