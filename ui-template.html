<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172f37" />
    <title>行間｜車輛監控</title>
    <link rel="stylesheet" href="/src/ui-template.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <a class="brand" href="/ui-template.html"
          ><span class="brand-symbol">行</span
          ><span>行間 <small>FLEET & MOBILITY</small></span></a
        >
        <div class="workspace-name" id="workspace-name">車隊監控台</div>
        <div class="header-actions">
          <span id="connection" class="connection" role="status">連線中</span
          ><a
            id="passenger-link"
            class="button primary"
            target="_blank"
            rel="noopener"
            >＋ 乘客頁面</a
          >
        </div>
      </header>
      <main class="workspace">
        <aside class="sidebar">
          <div class="sidebar-heading">
            <span class="eyebrow" id="section-label">OPERATIONS</span>
            <h1 id="page-title">掌握每一段行程</h1>
            <p id="page-subtitle">車隊動態</p>
          </div>
          <section id="monitor-panel">
            <div id="metrics" class="metrics"></div>
            <div class="tabs" role="tablist" aria-label="監控清單">
              <button
                id="vehicles-tab"
                role="tab"
                aria-selected="true"
                aria-controls="fleet-list"
              >
                車輛</button
              ><button
                id="requests-tab"
                role="tab"
                aria-selected="false"
                aria-controls="fleet-list"
              >
                乘車請求
              </button>
            </div>
            <label class="search"
              ><span>⌕</span
              ><input
                id="search"
                type="search"
                placeholder="搜尋車輛識別碼"
                aria-label="搜尋清單"
            /></label>
            <div
              id="fleet-list"
              class="fleet-list"
              role="tabpanel"
              aria-labelledby="vehicles-tab"
            ></div>
            <div class="sidebar-footer">
              <button
                id="settings-toggle"
                aria-expanded="true"
                aria-controls="settings-panel"
              >
                ⚙ 模擬設定</button
              ><a id="random-link" target="_blank" rel="noopener">隨機乘車 ↗</a>
            </div>
          </section>
          <section id="passenger-panel" hidden>
            <div id="trip-state" class="trip-state"></div>
            <form id="trip-form">
              <div class="trip-points">
                <label
                  ><span class="point-dot pickup"></span>上車點<input
                    id="pickup"
                    placeholder="在地圖選取，或輸入經度, 緯度"
                    required /></label
                ><label
                  ><span class="point-dot destination"></span>下車點<input
                    id="destination"
                    placeholder="在地圖選取，或輸入經度, 緯度"
                    required
                /></label>
              </div>
              <button id="apply-points" type="button" class="text-button">
                套用座標
              </button>
              <label class="field"
                >乘車人數<input
                  id="passenger-count"
                  type="number"
                  min="1"
                  step="1"
                  value="1"
                  required
              /></label>
              <button
                id="submit-trip"
                class="button primary wide"
                type="submit"
              >
                送出乘車請求 <span>↗</span>
              </button>
            </form>
            <div class="split-actions">
              <button id="reset-points">重新選點</button
              ><button id="random-trip">隨機乘車</button>
            </div>
            <button id="cancel-trip" class="button wide danger" hidden>
              取消乘車請求
            </button>
            <div id="passenger-detail"></div>
          </section>
          <div id="notice" class="notice" role="status" hidden></div>
        </aside>
        <section class="map-stage" aria-label="即時車輛地圖">
          <div id="map" aria-label="車輛與行程地圖"></div>
          <div id="map-placeholder" class="map-placeholder">
            <span class="map-mark">＋</span
            ><strong id="map-placeholder-title">正在載入地圖</strong>
            <p id="map-placeholder-message">連接地圖服務中</p>
          </div>
          <div class="map-top">
            <div class="map-caption">
              <span class="live-dot"></span
              ><span id="map-caption">即時車隊地圖</span>
            </div>
            <button
              id="map-settings-toggle"
              class="map-tool"
              aria-expanded="false"
              aria-controls="map-settings"
            >
              圖層設定
            </button>
          </div>
          <section
            id="map-settings"
            class="floating map-settings"
            hidden
            aria-label="圖層設定"
          >
            <label class="check-field"
              ><input id="poi" type="checkbox" /> 顯示地標</label
            ><label class="field"
              >模型大小 <output id="scale-label"></output
              ><input id="scale" type="range" min="1" max="100" step="1"
            /></label>
            <p id="preference-error" class="small-error"></p>
          </section>

          <div class="map-bottom">
            <span id="map-status">地圖初始化中</span
            ><span class="map-legend"
              ><i></i> 車輛 <i class="orange"></i> 行程</span
            >
          </div>
        </section>
        <aside class="inspector" aria-label="車輛與控制">
          <div class="inspector-heading">
            <span class="eyebrow">VEHICLE & CONTROL</span>
            <h2>車輛與行程</h2>
          </div>
          <section
            id="vehicle-detail"
            class="vehicle-detail"
            aria-label="選取車輛詳情"
          ></section>
          <section
            id="telemetry"
            class="telemetry"
            aria-label="行程資訊"
          ></section>
          <section id="settings-panel" class="settings-panel">
            <div class="panel-heading">
              <h2>模擬設定</h2>
              <button id="settings-close" aria-label="關閉模擬設定">×</button>
            </div>
            <form id="settings-form">
              <label class="field"
                >模擬速度 <output id="speed-label">1×</output
                ><input
                  id="speed"
                  type="range"
                  min="1"
                  max="300"
                  step="1"
                  value="1"
              /></label>
              <div class="two-fields">
                <label class="field"
                  >回報間隔（秒）<input
                    id="report-interval"
                    type="number"
                    min="0.1"
                    max="60"
                    step="0.05"
                    required /></label
                ><label class="field"
                  >更新間隔（秒）<input
                    id="poll-interval"
                    type="number"
                    min="0.1"
                    max="60"
                    step="0.05"
                    required
                /></label>
              </div>
              <button id="save-settings" class="button primary wide">
                套用設定
              </button>
            </form>
            <section id="route-panel" hidden>
              <h3>道路路線查詢</h3>
              <form id="route-form">
                <label class="field"
                  >起點（經度, 緯度）<input
                    id="route-origin"
                    placeholder="121.51, 25.04"
                    required /></label
                ><label class="field"
                  >終點（經度, 緯度）<input
                    id="route-destination"
                    placeholder="121.54, 25.05"
                    required
                /></label>
                <div class="split-actions">
                  <button id="query-route" type="submit">查詢路線</button
                  ><button id="clear-route" type="button">清除</button>
                </div>
              </form>
              <p id="route-result"></p>
            </section>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/ui-template.js"></script>
  </body>
</html>
