<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI 規格模板</title>
  </head>
  <body>
    <!-- 可調整區塊與視覺；請保留此頁的 DOM 契約，詳見 .scratch/dark-dispatch-ui/spec.md。 -->
    <main class="monitor ui-template">
      <aside class="panel" aria-label="車輛監控資料">
        <header>
          <span class="eyebrow">UI TEMPLATE</span>
          <h1>車輛監控</h1>
          <p id="connection" class="connection" role="status">連線中…</p>
        </header>
        <section class="vehicle-card" aria-labelledby="vehicle-id">
          <div class="card-heading">
            <h2 id="vehicle-id">車輛</h2>
            <span id="vehicle-status" class="badge">尚未回報</span>
          </div>
          <dl>
            <div><dt>經度</dt><dd id="longitude">—</dd></div>
            <div><dt>緯度</dt><dd id="latitude">—</dd></div>
            <div><dt>朝向</dt><dd id="heading">—</dd></div>
            <div><dt>載客上限</dt><dd id="capacity">—</dd></div>
            <div><dt>最後回報</dt><dd id="last-report">—</dd></div>
          </dl>
        </section>
        <section id="route-check" class="route-check" aria-labelledby="route-title" hidden>
          <h2 id="route-title">道路路線驗收</h2>
          <form id="route-form">
            <label for="route-origin">起點（經度, 緯度）</label>
            <input id="route-origin" name="origin" value="121.561, 25.0334" required>
            <label for="route-destination">終點（經度, 緯度）</label>
            <input id="route-destination" name="destination" value="121.517, 25.0478" required>
            <button id="route-submit" type="submit">查詢官方路線</button>
          </form>
          <p id="route-status" role="status">尚未查詢</p>
          <dl id="route-result" hidden>
            <div><dt>距離</dt><dd id="route-distance">—</dd></div>
            <div><dt>預估時間</dt><dd id="route-duration">—</dd></div>
            <div><dt>道路座標</dt><dd id="route-points">—</dd></div>
            <div><dt>道路起點</dt><dd id="route-road-start">—</dd></div>
            <div><dt>道路終點</dt><dd id="route-road-end">—</dd></div>
          </dl>
        </section>
        <dl class="settings">
          <div><dt>速度倍率</dt><dd id="speed">—</dd></div>
          <div><dt>車輛回報</dt><dd id="report-interval">—</dd></div>
          <div><dt>網頁更新</dt><dd id="poll-interval">—</dd></div>
          <div><dt>模擬輪次</dt><dd id="run-id">—</dd></div>
        </dl>
        <footer>
          <p id="map-status" role="status">等待 Server 資料</p>
          <p id="map-error" role="alert" hidden></p>
        </footer>
      </aside>
      <section class="map-region" aria-label="勤崴監控地圖">
        <div id="map" aria-label="車輛位置與朝向"></div>
        <span class="map-caption">勤崴地圖 · 3D 車輛</span>
      </section>
    </main>
    <script type="module" src="/src/ui-template.js"></script>
  </body>
</html>
